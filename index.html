  // タップで拡大、左右スワイプで前後の写真へ
  let swipeStart = null;
  photoStage.addEventListener('touchstart', (e) => {
    if (photoStage.classList.contains('zoomed') || e.touches.length !== 1) { swipeStart = null; return; }
    swipeStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  photoStage.addEventListener('touchend', (e) => {
    if (!swipeStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - swipeStart.x;
    const dy = t.clientY - swipeStart.y;
    swipeStart = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) showSibling(dx < 0 ? 1 : -1);
  });
  photoImg.addEventListener('click', () => {
    if (!photoStage.classList.contains('zoomed')) openViewer('fit');
  });

  // ---------- 全画面の拡大表示(つまんで拡大・縮小) ----------
  // 画像を本来の大きさで置き、transform(移動+倍率)で見せる。倍率1 = 画像の1ピクセルが画面の1ピクセル
  const zs = { scale: 1, tx: 0, ty: 0, fit: 1, mode: 'fit', touched: false };
  const zPointers = new Map();
  let zGesture = null;
  let lastTap = null;

  function imgSize() {
    return { w: photoImg.naturalWidth || 1, h: photoImg.naturalHeight || 1 };
  }

  function applyZoom(animate) {
    photoImg.classList.toggle('settle', !!animate);
    photoImg.style.transform = `translate(${zs.tx}px, ${zs.ty}px) scale(${zs.scale})`;
  }

  function maxScale() {
    return Math.max(4, zs.fit * 4);
  }

  // 拡大しすぎ・縮めすぎ・画面の外へずれすぎを、指を離したときに戻す
  function clampZoom() {
    const W = photoStage.clientWidth;
    const H = photoStage.clientHeight;
    zs.scale = Math.min(Math.max(zs.scale, zs.fit), maxScale());
    const { w, h } = imgSize();
    const sw = w * zs.scale;
    const sh = h * zs.scale;
    zs.tx = sw <= W ? (W - sw) / 2 : Math.min(0, Math.max(W - sw, zs.tx));
    zs.ty = sh <= H ? (H - sh) / 2 : Math.min(0, Math.max(H - sh, zs.ty));
  }

  // 指定した画面上の点を中心に、倍率を変える
  function zoomAt(newScale, cx, cy) {
    const ix = (cx - zs.tx) / zs.scale;
    const iy = (cy - zs.ty) / zs.scale;
    zs.scale = newScale;
    zs.tx = cx - ix * newScale;
    zs.ty = cy - iy * newScale;
  }

  function resetZoom(mode) {
    const W = photoStage.clientWidth;
    const H = photoStage.clientHeight;
    const { w, h } = imgSize();
    zs.fit = Math.min(W / w, H / h);
    zs.scale = mode === 'actual' ? Math.max(1, zs.fit) : zs.fit;
    zs.tx = (W - w * zs.scale) / 2;
    zs.ty = (H - h * zs.scale) / 2;
    clampZoom();
    applyZoom(false);
  }

  function updateViewerBadge() {
    $('viewerBadge').textContent = photoStage.classList.contains('orig')
      ? (photoImg.complete && photoImg.naturalWidth ? `元の画質 ${photoImg.naturalWidth}×${photoImg.naturalHeight}` : '元の画質')
      : '表示用の画像';
  }

  function openViewer(mode) {
    zs.mode = mode;
    zs.touched = false;
    photoStage.classList.add('zoomed');
    updateViewerBadge();
    resetZoom(mode);
    ensureTrap();
  }

  function closeViewer() {
    photoStage.classList.remove('zoomed');
    photoImg.classList.remove('settle');
    photoImg.style.transform = '';
    zPointers.clear();
    zGesture = null;
  }

  // 大きい画像の読み込みが後から終わったときなどは、まだ触っていなければ表示し直す
  photoImg.addEventListener('load', () => {
    if (!photoStage.classList.contains('zoomed')) return;
    updateViewerBadge();
    if (!zs.touched) resetZoom(zs.mode);
    else { clampZoom(); applyZoom(false); }
  });
  window.addEventListener('resize', () => {
    if (photoStage.classList.contains('zoomed')) resetZoom(zs.mode);
  });

  function startGesture() {
    const pts = Array.from(zPointers.values());
    if (pts.length >= 2) {
      const [a, b] = pts;
      zGesture = {
        type: 'pinch',
        dist: Math.hypot(a.x - b.x, a.y - b.y) || 1,
        scale: zs.scale,
        ix: ((a.x + b.x) / 2 - zs.tx) / zs.scale,
        iy: ((a.y + b.y) / 2 - zs.ty) / zs.scale
      };
    } else if (pts.length === 1) {
      zGesture = { type: 'pan', x: pts[0].x, y: pts[0].y };
    } else {
      zGesture = null;
    }
  }

  photoStage.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    zPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!photoStage.classList.contains('zoomed')) {
      // 普段の表示で2本指でつまんだら、そのまま拡大表示に切り替える
      if (zPointers.size >= 2) {
        swipeStart = null;
        openViewer('fit');
        zPointers.forEach((_, id) => { try { photoStage.setPointerCapture(id); } catch (err) { /* no-op */ } });
        zs.touched = true;
        startGesture();
      }
      return;
    }
    try { photoStage.setPointerCapture(e.pointerId); } catch (err) { /* no-op */ }
    zs.touched = true;
    photoImg.classList.remove('settle');
    // ダブルタップ: 全体表示 ⇔ 拡大
    if (zPointers.size === 1) {
      const now = Date.now();
      if (lastTap && now - lastTap.t < 300 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30) {
        lastTap = null;
        const target = zs.scale > zs.fit * 1.05 ? zs.fit : Math.min(maxScale(), Math.max(1, zs.fit * 2.5));
        const r = photoStage.getBoundingClientRect();
        zoomAt(target, e.clientX - r.left, e.clientY - r.top);
        clampZoom();
        applyZoom(true);
        zGesture = null;
        return;
      }
      lastTap = { t: now, x: e.clientX, y: e.clientY };
    }
    startGesture();
  });

  photoStage.addEventListener('pointermove', (e) => {
    if (!zPointers.has(e.pointerId)) return;
    zPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!photoStage.classList.contains('zoomed') || !zGesture) return;
    const r = photoStage.getBoundingClientRect();
    if (zGesture.type === 'pinch' && zPointers.size >= 2) {
      const [a, b] = Array.from(zPointers.values());
      const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      // 指を離すまでは、全体表示より少し小さくまで縮められる(離すと戻る)
      const s = Math.min(Math.max(zGesture.scale * dist / zGesture.dist, zs.fit * 0.6), maxScale() * 1.3);
      const mx = (a.x + b.x) / 2 - r.left;
      const my = (a.y + b.y) / 2 - r.top;
      zs.scale = s;
      zs.tx = mx - zGesture.ix * s;
      zs.ty = my - zGesture.iy * s;
      applyZoom(false);
    } else if (zGesture.type === 'pan') {
      zs.tx += e.clientX - zGesture.x;
      zs.ty += e.clientY - zGesture.y;
      zGesture.x = e.clientX;
      zGesture.y = e.clientY;
      applyZoom(false);
    }
  });

  function endPointer(e) {
    if (!zPointers.has(e.pointerId)) return;
    zPointers.delete(e.pointerId);
    if (!photoStage.classList.contains('zoomed')) return;
    if (zPointers.size) { startGesture(); return; }
    zGesture = null;
    clampZoom();
    applyZoom(true);
  }
  photoStage.addEventListener('pointerup', endPointer);
  photoStage.addEventListener('pointerleave', (e) => { if (!photoStage.classList.contains('zoomed')) zPointers.delete(e.pointerId); });
  photoStage.addEventListener('pointercancel', endPointer);

  // パソコンではマウスホイールで拡大・縮小
  photoStage.addEventListener('wheel', (e) => {
    if (!photoStage.classList.contains('zoomed')) return;
    e.preventDefault();
    zs.touched = true;
    const r = photoStage.getBoundingClientRect();
    zoomAt(zs.scale * Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
    clampZoom();
    applyZoom(false);
  }, { passive: false });

  $('viewerCloseBtn').addEventListener('click', (e) => { e.stopPropagation(); closeViewer(); });

  // 元の画質で見る: 押したときだけ、端末内(アップロード待ち)かGoogleドライブから元の写真を読み込む
  async function getOriginalBlob(p) {
    const pend = await idbGet('pending', p.id);
    if (pend) return pend;
    if (!p.driveId || !accessToken) return null;
    const res = await driveApiFetch(`/drive/v3/files/${p.driveId}?alt=media`);
    return res.ok ? res.blob() : null;
  }

  $('photoOrigBtn').addEventListener('click', async () => {
    const v = topView();
    const p = currentPhoto();
    if (!p) return;
    const btn = $('photoOrigBtn');
    const note = $('photoOrigNote');
    if (photoStage.classList.contains('orig')) { openViewer('actual'); return; }
    btn.disabled = true;
    note.textContent = '元の写真を読み込み中…';
    let blob = null;
    try { blob = await getOriginalBlob(p); } catch (e) { blob = null; }
    const still = () => topView() === v && v.id === p.id;
    if (!still()) return;
    btn.disabled = false;
    if (!blob) {
      note.textContent = p.driveId ? (accessToken ? '読み込めませんでした' : 'Googleにサインインすると見られます') : 'まだ別の端末からアップロードされていません';
      return;
    }
    const url = URL.createObjectURL(blob);
    const test = new Image();
    test.src = url;
    try {
      await test.decode();
    } catch (e) {
      URL.revokeObjectURL(url);
      note.textContent = 'この写真の形式はこの端末では表示できません';
      return;
    }
    if (!still()) { URL.revokeObjectURL(url); return; }
    if (photoImg.dataset.url) URL.revokeObjectURL(photoImg.dataset.url);
    photoImg.dataset.url = url;
    photoImg.src = url;
    photoStage.classList.add('orig');
    note.textContent = `元の画質 ${test.naturalWidth} × ${test.naturalHeight}`;
    // 等倍(画像の1ピクセル=画面の1ピクセル)で真ん中から表示。つまむと縮小できる
    openViewer('actual');
  });

  // ---------- 振り分けモード ----------
  let sortState = null; // { skipped:Set, undo:[], currentId }
  const sortImg = $('sortImg');

  function sortQueue() {
    // 古い写真から順に
    return livePhotos().filter((p) => photoFolder(p) === null).sort((a, b) => (a.takenAt || 0) - (b.takenAt || 0));
  }

  function pickNextSortId() {
    const p = sortQueue().find((x) => !sortState.skipped.has(x.id));
    return p ? p.id : null;
  }

  function startSort() {
    sortState = { skipped: new Set(), undo: [], currentId: null };
    sortState.currentId = pickNextSortId();
    pushView({ type: 'sort' });
  }

  function sortCurrent() {
    const p = sortState && data.photos[sortState.currentId];
    return p && !p.deleted && photoFolder(p) === null ? p : null;
  }

  function renderSortView(fromSync) {
    if (!sortState) { popView(); return; }
    const prevId = sortState.currentId;
    if (!sortCurrent()) sortState.currentId = pickNextSortId();
    const p = sortCurrent();
    const remaining = sortQueue().length;
    const skippedLeft = sortQueue().filter((x) => sortState.skipped.has(x.id)).length;
    $('sortTitle').textContent = `振り分け 残り${remaining}枚` + (skippedLeft ? `(あとで${skippedLeft})` : '');
    $('sortUndoBtn').disabled = !sortState.undo.length;
    $('sortSkipBtn').disabled = !p;
    $('sortInfoBtn').classList.toggle('hidden', !p);
    $('sortDeleteBtn').classList.toggle('hidden', !p);

    const done = $('sortDone');
    if (!p) {
      sortImg.classList.add('hidden');
      $('sortInfo').classList.add('hidden');
      $('destGrid').innerHTML = '';
      done.classList.remove('hidden');
      done.innerHTML = '';
      const msg = document.createElement('div');
      if (skippedLeft) {
        msg.textContent = `「あとで」にした写真が ${skippedLeft}枚 残っています`;
        const again = document.createElement('button');
        again.className = 'small-btn';
        again.style.marginTop = '12px';
        again.textContent = 'もう一度見直す';
        again.addEventListener('click', () => { sortState.skipped.clear(); sortState.currentId = pickNextSortId(); renderSortView(); });
        done.append(msg, again);
      } else {
        msg.textContent = '未整理の写真はすべて振り分けました 🎉';
        done.appendChild(msg);
      }
      const end = document.createElement('div');
      const endBtn = document.createElement('button');
      endBtn.className = 'small-btn';
      endBtn.style.marginTop = '12px';
      endBtn.textContent = '終了する';
      endBtn.addEventListener('click', popView);
      end.appendChild(endBtn);
      done.appendChild(end);
      return;
    }
    done.classList.add('hidden');
    sortImg.classList.remove('hidden');
    $('sortInfo').classList.remove('hidden');
    $('sortName').textContent = p.name;
    $('sortDate').textContent = '撮影 ' + formatDateTime(p.takenAt);
    if (!fromSync || prevId !== p.id || !sortImg.getAttribute('src')) {
      const id = p.id;
      showLargeImage(sortImg, p, () => topView().type === 'sort' && sortState && sortState.currentId === id, null);
      // 次の写真を先に読み込んでおく
      const nextP = sortQueue().find((x) => x.id !== id && !sortState.skipped.has(x.id));
      if (nextP) getViewBlob(nextP);
    }
    renderDestButtons();
  }

  function destCandidates() {
    const list = getRecent();
    const seen = new Set(list);
    if (list.length < 8) {
      // 最近使ったものが少ないうちは、ホーム直下のフォルダ→その他の順で埋める
      const rest = liveFolders().filter((f) => !seen.has(f.id) && folderPath(f.id).length)
        .sort((a, b) => folderPath(a.id).length - folderPath(b.id).length || byName(a, b));
      for (const f of rest) {
        if (list.length >= 8) break;
        list.push(f.id);
      }
    }
    return list.slice(0, 8);
  }

  function renderDestButtons() {
    const grid = $('destGrid');
    grid.innerHTML = '';
    destCandidates().forEach((id) => {
      const f = getFolder(id);
      const b = document.createElement('button');
      b.className = 'dest-btn';
      const n = document.createElement('span');
      n.className = 'dest-name';
      n.textContent = f.name;
      b.appendChild(n);
      const parents = folderPath(id).slice(0, -1).map((x) => x.name).join(' › ');
      if (parents) {
        const s = document.createElement('span');
        s.className = 'dest-sub';
        s.textContent = parents;
        b.appendChild(s);
      }
      b.addEventListener('click', () => sortAssign(id));
      grid.appendChild(b);
    });
    const other = document.createElement('button');
    other.className = 'dest-btn other';
    other.textContent = liveFolders().length ? '📁 ほかのフォルダ・新しいフォルダ…' : '＋ 行き先のフォルダを作る';
    other.addEventListener('click', () => {
      openPicker({ title: 'この写真の行き先', mode: 'photos', onPick: (dest) => sortAssign(dest) });
    });
    grid.appendChild(other);
  }

  function flash(text) {
    const el = document.createElement('div');
    el.className = 'flash';
    el.textContent = text;
    $('sortStage').appendChild(el);
    setTimeout(() => el.remove(), 700);
  }

  function sortAssign(destId) {
    const p = sortCurrent();
    if (!p || !destId) return;
    p.folderId = destId;
    touch(p);
    addRecent(destId);
    saveData();
    sortState.undo.push({ type: 'move', id: p.id });
    sortState.currentId = pickNextSortId();
    flash('→ ' + getFolder(destId).name);
    renderSortView();
  }

  $('sortSkipBtn').addEventListener('click', () => {
    const p = sortCurrent();
    if (!p) return;
    sortState.skipped.add(p.id);
    sortState.undo.push({ type: 'skip', id: p.id });
    sortState.currentId = pickNextSortId();
    renderSortView();
  });

  $('sortUndoBtn').addEventListener('click', () => {
    const e = sortState && sortState.undo.pop();
    if (!e) return;
    const p = data.photos[e.id];
    if (!p || p.deleted) { renderSortView(); return; }
    if (e.type === 'move') {
      p.folderId = null;
      touch(p);
      saveData();
    } else {
      sortState.skipped.delete(e.id);
    }
    sortState.currentId = e.id;
    renderSortView();
  });

  $('sortDeleteBtn').addEventListener('click', () => {
    const p = sortCurrent();
    if (!p) return;
    showConfirm('この写真を削除しますか？', 'Googleドライブ上の写真はゴミ箱に移ります(30日以内なら戻せます)。', '削除', () => {
      deletePhotos([p.id]);
      sortState.undo = sortState.undo.filter((x) => x.id !== p.id);
      sortState.currentId = pickNextSortId();
      renderSortView();
    });
  });

  $('sortInfoBtn').addEventListener('click', () => {
    const p = sortCurrent();
    if (p) pushView({ type: 'photo', id: p.id, list: [p.id] });
  });
  $('sortBackBtn').addEventListener('click', popView);

  // ---------- 行き先フォルダを選ぶ画面 ----------
  // mode 'photos': 写真の行き先(ホームには置けない) / mode 'folder': フォルダの移動先(ホーム直下も可)
  // mode 'jump': フォルダを探して開く
  let picker = null;

  function openPicker(opts) {
    picker = Object.assign({ browse: 'root' }, opts);
    $('pickerTitle').textContent = opts.title || '行き先のフォルダ';
    $('pickerSearch').value = '';
    pickerOverlay.classList.remove('hidden');
    renderPicker();
    ensureTrap();
  }

  function closePicker() {
    pickerOverlay.classList.add('hidden');
    picker = null;
  }

  function pickerAllows(id) {
    if (!picker) return false;
    if (picker.mode === 'folder') {
      const moving = picker.movingFolderId;
      if (id === moving || (id !== 'root' && isInside(id, moving))) return false;
    }
    return true;
  }

  function choose(id) {
    const p = picker;
    closePicker();
    if (p && p.onPick) p.onPick(id);
  }

  function renderPicker() {
    if (!picker) return;
    const q = normalizeForSearch($('pickerSearch').value.trim());
    const recentWrap = $('pickerRecentWrap');
    const recentEl = $('pickerRecent');
    const crumbEl = $('pickerCrumb');
    const listEl = $('pickerList');
    recentEl.innerHTML = '';
    crumbEl.innerHTML = '';
    listEl.innerHTML = '';

    const stars = shortcutFolders().map((f) => f.id).filter(pickerAllows);
    $('pickerStarWrap').classList.toggle('hidden', !!q || !stars.length);
    $('pickerStar').innerHTML = '';
    stars.forEach((id) => {
      const c = document.createElement('button');
      c.className = 'chip star';
      c.textContent = '⭐ ' + getFolder(id).name;
      c.title = folderLabel(id);
      c.addEventListener('click', () => choose(id));
      $('pickerStar').appendChild(c);
    });

    const recent = getRecent().filter(pickerAllows).slice(0, 6);
    recentWrap.classList.toggle('hidden', !!q || !recent.length);
    recent.forEach((id) => {
      const c = document.createElement('button');
      c.className = 'chip';
      c.textContent = getFolder(id).name;
      c.title = folderLabel(id);
      c.addEventListener('click', () => choose(id));
      recentEl.appendChild(c);
    });

    let rows;
    if (q) {
      crumbEl.classList.add('hidden');
      rows = liveFolders().filter((f) => folderPath(f.id).length && pickerAllows(f.id) && normalizeForSearch(f.name).includes(q))
        .sort(byName).map((f) => ({ f, showPath: true }));
    } else {
      crumbEl.classList.remove('hidden');
      if (!getFolder(picker.browse)) picker.browse = 'root';
      const chain = [ROOT].concat(folderPath(picker.browse));
      chain.forEach((f, i) => {
        if (i > 0) {
          const sep = document.createElement('span');
          sep.className = 'crumb-sep';
          sep.textContent = '›';
          crumbEl.appendChild(sep);
        }
        const el = document.createElement('span');
        const isCurrent = i === chain.length - 1;
        el.className = 'crumb' + (isCurrent ? ' crumb-current' : '');
        el.textContent = f.name;
        if (!isCurrent) el.addEventListener('click', () => { picker.browse = f.id; renderPicker(); });
        crumbEl.appendChild(el);
      });
      rows = childFolders(picker.browse).filter((f) => pickerAllows(f.id)).map((f) => ({ f, showPath: false }));
    }

    if (!rows.length) {
      const e = document.createElement('div');
      e.className = 'pick-empty';
      e.textContent = q ? '見つかりません。「＋ 新しいフォルダ」で作れます' : 'この中にフォルダはありません';
      listEl.appendChild(e);
    }
    rows.forEach(({ f, showPath }) => {
      const row = document.createElement('div');
      row.className = 'pick-row';
      const main = document.createElement('div');
      main.className = 'pick-main';
      main.textContent = '📁 ' + f.name;
      if (showPath) {
        const parents = folderPath(f.id).slice(0, -1).map((x) => x.name).join(' › ');
        const s = document.createElement('span');
        s.className = 'pick-path';
        s.textContent = parents ? 'ホーム › ' + parents : 'ホーム';
        main.appendChild(s);
      }
      main.addEventListener('click', () => choose(f.id));
      row.appendChild(main);
      if (childFolders(f.id).some((c) => pickerAllows(c.id))) {
        const open = document.createElement('button');
        open.className = 'pick-open';
        open.textContent = '中を見る ›';
        open.addEventListener('click', () => { picker.browse = f.id; $('pickerSearch').value = ''; renderPicker(); });
        row.appendChild(open);
      }
      listEl.appendChild(row);
    });

    const atRoot = picker.browse === 'root';
    const hereBtn = $('pickerHereBtn');
    if (q) hereBtn.classList.add('hidden');
    else if (picker.mode === 'jump') {
      hereBtn.classList.toggle('hidden', atRoot);
      if (!atRoot) hereBtn.textContent = `「${getFolder(picker.browse).name}」を開く`;
    } else if (picker.mode === 'folder') {
      hereBtn.classList.remove('hidden');
      hereBtn.textContent = atRoot ? 'ホーム直下に移動' : `「${getFolder(picker.browse).name}」に決定`;
    } else {
      hereBtn.classList.toggle('hidden', atRoot);
      if (!atRoot) hereBtn.textContent = `「${getFolder(picker.browse).name}」に決定`;
    }
    $('pickerUnsortedBtn').classList.toggle('hidden', !(picker.mode === 'photos' && picker.allowUnsorted));
    $('pickerNewBtn').classList.toggle('hidden', picker.mode === 'jump');
  }

  $('pickerSearch').addEventListener('input', renderPicker);
  $('pickerCancelBtn').addEventListener('click', closePicker);
  $('pickerHereBtn').addEventListener('click', () => { if (picker) choose(picker.browse); });
  $('pickerUnsortedBtn').addEventListener('click', () => choose(null));
  $('pickerNewBtn').addEventListener('click', () => {
    if (!picker) return;
    const parent = $('pickerSearch').value.trim() ? 'root' : picker.browse;
    const suggested = $('pickerSearch').value.trim();
    showPrompt(`新しいフォルダの名前(作る場所: ${folderLabel(parent) || 'ホーム'})`, suggested, (name) => {
      if (!name) return;
      const f = { id: genId(), name, parentId: parent, updatedAt: Date.now() };
      data.folders[f.id] = f;
      saveData();
      choose(f.id);
    });
  });

  // ---------- Google Drive 同期 ----------
  const GOOGLE_CLIENT_ID = '714202952870-hf8no72rpvh31nrpddqnpl77ibjsj3hc.apps.googleusercontent.com';
  const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
  const DRIVE_DATA_NAME = 'photo_data.json';
  const DRIVE_APP_FOLDER = '写真整理';
  const DRIVE_THUMB_FOLDER = 'サムネイル';
  const DRIVE_FILE_ID_KEY = 'photoAppDriveFileId_v1';
  const GOOGLE_LINKED_KEY = 'photoAppGoogleLinked_v1';
  const GOOGLE_HINT_KEY = 'photoAppGoogleHint_v1';
  const MEMO_HINT_KEY = 'memoAppGoogleHint_v1'; // メモ帳と同じアカウントを使うため、あれば参考にする

  let syncState = 'signed_out'; // 'signed_out' | 'idle' | 'syncing' | 'error'
  let accessToken = null;
  let dataFileId = localStorage.getItem(DRIVE_FILE_ID_KEY);
  let pendingDriveUpload = false;
  let driveSyncTimer = null;
  let gisTokenClient = null;
  let lastSyncedAt = null;
  let autoSignInArmed = false;
  let syncBusy = false;
  let syncAgain = false;

  function setSyncState(state) {
    syncState = state;
    updateSyncStatusUI();
  }

  function updateSyncStatusUI() {
    let text = '';
    if (syncState === 'signed_out') text = autoSignInArmed ? '画面に触れると同期を再開します' : 'Googleと未連携です';
    else if (syncState === 'syncing') text = '同期中…';
    else if (syncState === 'error') text = navigator.onLine ? '同期エラーが発生しました' : 'オフライン - オンライン復帰時に自動で同期します';
    else if (syncState === 'idle') text = lastSyncedAt ? `最終同期: ${formatDateTime(lastSyncedAt)}` : '同期の準備ができています';
    syncStatusText.textContent = text;
    signInBtn.classList.toggle('hidden', syncState !== 'signed_out');
    signOutBtn.classList.toggle('hidden', syncState === 'signed_out');
    updateUploadStatus();
  }

  async function updateUploadStatus() {
    const keys = await idbKeys('pending');
    const n = keys.filter((id) => data.photos[id] && !data.photos[id].deleted).length;
    const text = n ? `☁ Googleドライブへのアップロード待ち ${n}枚` + (accessToken ? (uploadBusy ? '(アップロード中…)' : '') : '(サインインすると送ります)') : '';
    uploadStatusText.textContent = text || '☁ すべての写真をGoogleドライブに保存済みです';
    const homeEl = $('homeUploadStatus');
    if (homeEl) {
      homeEl.textContent = text;
      homeEl.classList.toggle('hidden', !text);
    }
  }

  function loadGisScript(callback) {
    if (window.google && window.google.accounts && window.google.accounts.oauth2) { callback(); return; }
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = callback;
    s.onerror = () => setSyncState('error');
    document.head.appendChild(s);
  }

  function initDriveSync() {
    loadGisScript(() => {
      gisTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: handleGisToken,
        error_callback: () => { setSyncState('signed_out'); }
      });
      // 起動直後に自分でサインイン画面を開くとポップアップとしてブロックされるため、
      // 以前サインインしたことがあれば、ロック解除後に画面に触れたタイミングでサインインし直す
      if (localStorage.getItem(GOOGLE_LINKED_KEY) || dataFileId) armAutoSignIn();
    });
  }

  function handleGisToken(resp) {
    if (resp && resp.access_token) {
      accessToken = resp.access_token;
      localStorage.setItem(GOOGLE_LINKED_KEY, '1');
      disarmAutoSignIn();
      thumbFailed.clear();
      setSyncState('idle');
      syncNow();
      rememberGoogleAccount();
    } else {
      setSyncState('signed_out');
    }
  }

  async function rememberGoogleAccount() {
    try {
      const res = await driveApiFetch('/drive/v3/about?fields=user(emailAddress)');
      if (!res.ok) return;
      const d = await res.json();
      if (d.user && d.user.emailAddress) localStorage.setItem(GOOGLE_HINT_KEY, d.user.emailAddress);
    } catch (e) { /* 覚えられなくても同期には影響しない */ }
  }

  function onTapForAutoSignIn(e) {
    if (!lockView.classList.contains('hidden')) return; // ロック中はPIN・指紋の操作を優先する
    if (e.target === signInBtn) { disarmAutoSignIn(); return; } // サインインボタン自体の処理に任せる
    // 撮影・写真選択のボタンは、カメラ等の画面と重ならないよう次のタップに回す
    if (e.target.closest && e.target.closest('[data-skip-signin]')) return;
    disarmAutoSignIn();
    if (!gisTokenClient || accessToken) return;
    const hint = localStorage.getItem(GOOGLE_HINT_KEY) || localStorage.getItem(MEMO_HINT_KEY);
    gisTokenClient.requestAccessToken(hint ? { prompt: '', hint } : { prompt: '' });
  }

  function armAutoSignIn() {
    if (autoSignInArmed) return;
    autoSignInArmed = true;
    document.addEventListener('click', onTapForAutoSignIn, true);
    updateSyncStatusUI();
  }

  function disarmAutoSignIn() {
    if (!autoSignInArmed) return;
    autoSignInArmed = false;
    document.removeEventListener('click', onTapForAutoSignIn, true);
    updateSyncStatusUI();
  }

  function signIn() {
    if (!gisTokenClient) { initDriveSync(); return; }
    const hint = localStorage.getItem(MEMO_HINT_KEY);
    gisTokenClient.requestAccessToken(hint ? { prompt: 'consent', hint } : { prompt: 'consent' });
  }

  function signOut() {
    const oldToken = accessToken;
    accessToken = null;
    dataFileId = null;
    localStorage.removeItem(DRIVE_FILE_ID_KEY);
    localStorage.removeItem(GOOGLE_LINKED_KEY);
    localStorage.removeItem(GOOGLE_HINT_KEY);
    disarmAutoSignIn();
    setSyncState('signed_out');
    if (window.google && oldToken) google.accounts.oauth2.revoke(oldToken, () => {});
  }

  function silentReauth() {
    // 期限切れ。ここで自分からサインイン画面を開くとポップアップとしてブロックされるので、
    // 次に画面に触れたときにサインインし直す(取り直したらDriveとの同期も再開される)
    accessToken = null;
    if (gisTokenClient) armAutoSignIn();
    setSyncState('signed_out');
    return false;
  }

  async function driveApiFetch(path, options) {
    if (!accessToken) throw new Error('no token');
    options = options || {};
    options.headers = Object.assign({}, options.headers, { Authorization: 'Bearer ' + accessToken });
    const res = await fetch('https://www.googleapis.com' + path, options);
    if (res.status === 401) silentReauth();
    return res;
  }

  async function driveFind(q) {
    const res = await driveApiFetch(`/drive/v3/files?q=${encodeURIComponent(q)}&spaces=drive&fields=files(id)&orderBy=createdTime`);
    if (!res.ok) throw new Error('find');
    const d = await res.json();
    return (d.files && d.files[0]) || null;
  }

  async function driveCreateFolder(name, parentId) {
    const meta = { name, mimeType: 'application/vnd.google-apps.folder' };
    if (parentId) meta.parents = [parentId];
    const res = await driveApiFetch('/drive/v3/files?fields=id', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=UTF-8' },
      body: JSON.stringify(meta)
    });
    if (!res.ok) throw new Error('mkdir');
    return (await res.json()).id;
  }

  async function ensureDriveFolders() {
    if (!data.driveFolderId) {
      const f = await driveFind(`name='${DRIVE_APP_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
      data.driveFolderId = f ? f.id : await driveCreateFolder(DRIVE_APP_FOLDER, null);
      saveData();
    }
    if (!data.driveThumbFolderId) {
      const f = await driveFind(`name='${DRIVE_THUMB_FOLDER}' and '${data.driveFolderId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`);
      data.driveThumbFolderId = f ? f.id : await driveCreateFolder(DRIVE_THUMB_FOLDER, data.driveFolderId);
      saveData();
    }
    return { main: data.driveFolderId, thumbs: data.driveThumbFolderId };
  }

  // 写真のような大きいファイルは「再開可能アップロード」で送る
  async function driveUploadBlob(blob, name, parentId, mime) {
    const meta = { name, parents: [parentId], mimeType: mime };
    const res = await driveApiFetch('/upload/drive/v3/files?uploadType=resumable&fields=id', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=UTF-8', 'X-Upload-Content-Type': mime },
      body: JSON.stringify(meta)
    });
    if (!res.ok) throw new Error('upload-init');
    const loc = res.headers.get('Location');
    if (loc) {
      const put = await fetch(loc, { method: 'PUT', headers: { 'Content-Type': mime }, body: blob });
      if (!put.ok) throw new Error('upload');
      return (await put.json()).id;
    }
    // Location が読めない環境向け: 1回で送る方式
    const boundary = 'photoapp_' + Date.now().toString(36);
    const body = new Blob([
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: ${mime}\r\n\r\n`,
      blob,
      `\r\n--${boundary}--`
    ]);
    const res2 = await driveApiFetch('/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method: 'POST',
      headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
      body
    });
    if (!res2.ok) throw new Error('upload');
    return (await res2.json()).id;
  }

  async function driveTrash(fileId) {
    if (!fileId) return;
    const res = await driveApiFetch(`/drive/v3/files/${fileId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json; charset=UTF-8' },
      body: JSON.stringify({ trashed: true })
    });
    if (!res.ok && res.status !== 404) throw new Error('trash');
  }

  function photoFileName(p) {
    const d = new Date(p.takenAt || Date.now());
    const ext = /png/.test(p.mime) ? 'png' : /webp/.test(p.mime) ? 'webp' : /gif/.test(p.mime) ? 'gif' : /heic|heif/.test(p.mime) ? 'heic' : 'jpg';
    return `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}_${p.id.slice(-6)}.${ext}`;
  }

  // 端末に残っている「アップロード待ち」の写真をDriveに送る。削除した写真はDriveのゴミ箱へ
  let uploadBusy = false;
  async function processUploads() {
    if (uploadBusy || importing || !accessToken || !navigator.onLine) return;
    uploadBusy = true;
    updateUploadStatus();
    let changed = false;
    try {
      for (const p of Object.values(data.photos)) {
        if (!accessToken) break;
        if (p.deleted && (p.driveId || p.thumbDriveId) && !p.driveTrashed) {
          await driveTrash(p.driveId);
          await driveTrash(p.thumbDriveId);
          const cur = data.photos[p.id];
          if (cur) { cur.driveTrashed = true; changed = true; }
        }
      }
      const keys = await idbKeys('pending');
      for (const id of keys) {
        if (!accessToken) break;
        let p = data.photos[id];
        if (!p || p.deleted) { await idbDel('pending', id); continue; }
        if (!p.driveId) {
          const blob = await idbGet('pending', id);
          if (!blob) continue;
          const folders = await ensureDriveFolders();
          const driveId = await driveUploadBlob(blob, photoFileName(p), folders.main, p.mime || blob.type || 'image/jpeg');
          p = data.photos[id];
          if (!p) continue;
          p.driveId = driveId; // 他の項目の更新日時は変えない(他端末での編集を上書きしないため)
          changed = true;
          persistLocal();
        }
        if (!p.thumbDriveId) {
          const tb = await idbGet('thumbs', id);
          if (tb) {
            const folders = await ensureDriveFolders();
            const tid = await driveUploadBlob(tb, 'thumb_' + id + '.jpg', folders.thumbs, 'image/jpeg');
            p = data.photos[id];
            if (!p) continue;
            p.thumbDriveId = tid;
            changed = true;
            persistLocal();
          }
        }
        if (p.driveId && p.thumbDriveId) await idbDel('pending', id);
        if (p.deleted) continue;
        document.querySelectorAll(`.tile[data-id="${id}"] .tile-badge`).forEach((b) => b.remove());
        updateUploadStatus();
      }
    } catch (e) {
      /* 通信エラー等。次の同期のタイミングで続きから送る */
    } finally {
      uploadBusy = false;
      updateUploadStatus();
      if (changed) saveData();
    }
  }

  async function driveDownloadJson(fileId) {
    const res = await driveApiFetch(`/drive/v3/files/${fileId}?alt=media`);
    if (res.status === 404) return { notFound: true };
    if (!res.ok) throw new Error('download');
    try { return await res.json(); } catch (e) { return null; }
  }

  async function uploadDataFile() {
    const body = JSON.stringify(data);
    if (dataFileId) {
      const res = await driveApiFetch(`/upload/drive/v3/files/${dataFileId}?uploadType=media`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body
      });
      if (res.status === 404) {
        dataFileId = null;
        localStorage.removeItem(DRIVE_FILE_ID_KEY);
        return uploadDataFile();
      }
      return res.ok;
    }
    const folders = await ensureDriveFolders();
    const boundary = 'photoapp_' + Date.now().toString(36);
    const metadata = JSON.stringify({ name: DRIVE_DATA_NAME, parents: [folders.main] });
    const multipartBody =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${metadata}\r\n` +
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(data)}\r\n--${boundary}--`;
    const res = await driveApiFetch('/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method: 'POST',
      headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
      body: multipartBody
    });
    if (!res.ok) return false;
    dataFileId = (await res.json()).id;
    localStorage.setItem(DRIVE_FILE_ID_KEY, dataFileId);
    return true;
  }

  // 写真・フォルダ1件ずつ、新しく更新された方を採用して合体させる
  // (複数の端末で別々に写真を追加しても、どちらも消えないようにするため)
  function mergeRecord(l, r) {
    if (!l) return r;
    if (!r) return l;
    const newer = (r.updatedAt || 0) > (l.updatedAt || 0) ? r : l;
    const older = newer === r ? l : r;
    const m = Object.assign({}, newer);
    ['driveId', 'thumbDriveId', 'driveTrashed'].forEach((k) => { if (!m[k] && older[k]) m[k] = older[k]; });
    if (older.deleted && !m.deleted) {
      // どちらかで削除されていれば削除を優先する
      Object.keys(m).forEach((k) => { if (!['id', 'driveId', 'thumbDriveId', 'driveTrashed'].includes(k)) delete m[k]; });
      m.deleted = true;
      m.updatedAt = Math.max(l.updatedAt || 0, r.updatedAt || 0);
    }
    return m;
  }

  function mergeRemote(remote) {
    if (!remote || typeof remote !== 'object' || !remote.photos || !remote.folders) return { changedLocal: false, needUpload: true };
    let changedLocal = false;
    let needUpload = false;
    ['folders', 'photos'].forEach((key) => {
      const L = data[key];
      const R = remote[key];
      const ids = new Set(Object.keys(L).concat(Object.keys(R)));
      ids.forEach((id) => {
        const l = L[id];
        const r = R[id];
        const m = mergeRecord(l, r);
        const ms = JSON.stringify(m);
        if (ms !== JSON.stringify(l)) {
          if (key === 'photos' && m.deleted && l && !l.deleted) purgeLocalPhoto(id);
          L[id] = m;
          changedLocal = true;
        }
        if (ms !== JSON.stringify(r)) needUpload = true;
      });
    });
    ['driveFolderId', 'driveThumbFolderId'].forEach((k) => {
      if (remote[k]) {
        if (data[k] !== remote[k]) { data[k] = remote[k]; changedLocal = true; }
      } else if (data[k]) needUpload = true;
    });
    return { changedLocal, needUpload };
  }

  async function syncNow() {
    clearTimeout(driveSyncTimer);
    if (!accessToken) { pendingDriveUpload = true; return; }
    if (!navigator.onLine) { pendingDriveUpload = true; setSyncState('error'); return; }
    if (syncBusy) { syncAgain = true; return; }
    syncBusy = true;
    setSyncState('syncing');
    try {
      if (!dataFileId) {
        const f = await driveFind(`name='${DRIVE_DATA_NAME}' and trashed=false`);
        if (f) { dataFileId = f.id; localStorage.setItem(DRIVE_FILE_ID_KEY, dataFileId); }
      }
      let remote = null;
      if (dataFileId) {
        remote = await driveDownloadJson(dataFileId);
        if (remote && remote.notFound) {
          dataFileId = null;
          localStorage.removeItem(DRIVE_FILE_ID_KEY);
          const f = await driveFind(`name='${DRIVE_DATA_NAME}' and trashed=false`);
          remote = null;
          if (f) {
            dataFileId = f.id;
            localStorage.setItem(DRIVE_FILE_ID_KEY, dataFileId);
            remote = await driveDownloadJson(dataFileId);
            if (remote && remote.notFound) remote = null;
          }
        }
      }
      const { changedLocal, needUpload } = mergeRemote(remote);
      if (changedLocal) {
        persistLocal();
        refreshCurrentView();
      }
      if (needUpload || !dataFileId) {
        if (!(await uploadDataFile())) throw new Error('upload');
      }
      pendingDriveUpload = false;
      lastSyncedAt = Date.now();
      setSyncState('idle');
    } catch (e) {
      if (accessToken) setSyncState('error');
    } finally {
      syncBusy = false;
    }
    if (syncAgain) { syncAgain = false; syncNow(); return; }
    processUploads();
  }

  function scheduleDriveSync() {
    pendingDriveUpload = true;
    clearTimeout(driveSyncTimer);
    driveSyncTimer = setTimeout(syncNow, 1200);
  }

  window.addEventListener('online', () => { if (accessToken) syncNow(); });

  // アプリが再び前に来たとき・一定間隔で、他の端末での変更を取り込む
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && accessToken) syncNow();
  });
  setInterval(() => {
    if (accessToken && !syncBusy && !document.hidden) syncNow();
  }, 30000);

  signInBtn.addEventListener('click', signIn);
  signOutBtn.addEventListener('click', signOut);
  $('syncNowBtn').addEventListener('click', () => {
    if (!accessToken) { signIn(); return; }
    syncNow();
  });

  // ---------- 設定 ----------
  $('settingsBtn').addEventListener('click', () => {
    settingsOverlay.classList.remove('hidden');
    updateSyncStatusUI();
    ensureTrap();
  });
  $('settingsCloseBtn').addEventListener('click', () => settingsOverlay.classList.add('hidden'));

  // ---------- PINロック ----------
  const lockMessage = $('lockMessage');
  const lockInput = $('lockInput');
  const lockConfirmInput = $('lockConfirmInput');
  const lockError = $('lockError');
  const lockBioBtn = $('lockBioBtn');
  const bioOnBtn = $('bioOnBtn');
  const bioOffBtn = $('bioOffBtn');
  const PIN_HASH_KEY = 'photoAppPinHash_v1';
  const BIO_CRED_KEY = 'photoAppBioCred_v1';

  async function sha256Hex(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  function isPinConfigured() {
    return !!localStorage.getItem(PIN_HASH_KEY);
  }

  // ---------- 指紋で解除(端末の指紋・画面ロックで本人確認する) ----------
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = (str) => Uint8Array.from(atob(str), (c) => c.charCodeAt(0));
  const randomBytes = (n) => crypto.getRandomValues(new Uint8Array(n));
  let bioSupported = false;
  let bioInProgress = false;

  function isBioConfigured() {
    return !!localStorage.getItem(BIO_CRED_KEY);
  }

  async function checkBioSupported() {
    try {
      bioSupported = !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
    } catch (e) {
      bioSupported = false;
    }
    updateBioSettingsUI();
  }

  function updateBioSettingsUI() {
    bioOnBtn.classList.toggle('hidden', !bioSupported || isBioConfigured());
    bioOffBtn.classList.toggle('hidden', !isBioConfigured());
  }

  async function bioRegister() {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: randomBytes(32),
      rp: { name: '写真整理' },
      user: { id: randomBytes(16), name: '写真整理', displayName: '写真整理' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
      timeout: 60000
    } });
    localStorage.setItem(BIO_CRED_KEY, b64(cred.rawId));
  }

  async function bioVerify() {
    const res = await navigator.credentials.get({ publicKey: {
      challenge: randomBytes(32),
      allowCredentials: [{ type: 'public-key', id: unb64(localStorage.getItem(BIO_CRED_KEY)) }],
      userVerification: 'required',
      timeout: 60000
    } });
    // authenticatorData の UV フラグ(本人確認済み)を確かめる
    const flags = new Uint8Array(res.response.authenticatorData)[32];
    return !!(flags & 0x04);
  }

  async function tryBioUnlock() {
    if (bioInProgress || !isPinConfigured() || !isBioConfigured() || lockView.classList.contains('hidden')) return;
    bioInProgress = true;
    try {
      if (await bioVerify()) {
        hideLockScreen();
      } else {
        lockError.textContent = '指紋を確認できませんでした';
        lockError.classList.remove('hidden');
      }
    } catch (e) {
      // キャンセルされた場合などは、そのままPIN入力を続けてもらう
    } finally {
      bioInProgress = false;
    }
  }

  function showLockScreen() {
    lockView.classList.remove('hidden');
    lockError.classList.add('hidden');
    lockInput.value = '';
    lockConfirmInput.value = '';
    if (isPinConfigured()) {
      lockMessage.textContent = 'PINコードを入力してください';
      lockConfirmInput.classList.add('hidden');
    } else {
      lockMessage.textContent = 'はじめに使うPINコードを設定してください(4桁以上の数字)';
      lockConfirmInput.classList.remove('hidden');
    }
    const useBio = isPinConfigured() && isBioConfigured();
    lockBioBtn.classList.toggle('hidden', !useBio);
    if (useBio) {
      // 画面に出ているときだけ指紋の確認を出す(閉じる途中のpagehideでは出さない)
      if (document.visibilityState === 'visible') setTimeout(tryBioUnlock, 300);
    } else {
      setTimeout(() => lockInput.focus(), 50);
    }
  }

  function hideLockScreen() {
    lockView.classList.add('hidden');
  }

  async function handleLockSubmit() {
    const value = lockInput.value.trim();
    if (value.length < 4) {
      lockError.textContent = '4桁以上の数字を入力してください';
      lockError.classList.remove('hidden');
      return;
    }
    if (isPinConfigured()) {
      const stored = localStorage.getItem(PIN_HASH_KEY);
      const hash = await sha256Hex(value);
      if (hash !== stored) {
        lockError.textContent = 'PINコードが違います';
        lockError.classList.remove('hidden');
        lockInput.value = '';
        lockInput.focus();
        return;
      }
      hideLockScreen();
    } else {
      const confirmValue = lockConfirmInput.value.trim();
      if (confirmValue !== value) {
        lockError.textContent = '確認用のPINコードが一致しません';
        lockError.classList.remove('hidden');
        lockConfirmInput.value = '';
        lockConfirmInput.focus();
        return;
      }
      const hash = await sha256Hex(value);
      localStorage.setItem(PIN_HASH_KEY, hash);
      hideLockScreen();
    }
  }

  $('lockSubmitBtn').addEventListener('click', handleLockSubmit);
  lockInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && lockConfirmInput.classList.contains('hidden')) handleLockSubmit();
  });
  lockConfirmInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleLockSubmit();
  });

  lockBioBtn.addEventListener('click', tryBioUnlock);

  bioOnBtn.addEventListener('click', async () => {
    try {
      await bioRegister();
      updateBioSettingsUI();
      alert('指紋で解除できるようになりました');
    } catch (e) {
      alert('指紋の登録ができませんでした');
    }
  });

  bioOffBtn.addEventListener('click', () => {
    localStorage.removeItem(BIO_CRED_KEY);
    updateBioSettingsUI();
    alert('指紋での解除をやめました');
  });

  $('changePinBtn').addEventListener('click', () => {
    settingsOverlay.classList.add('hidden');
    localStorage.removeItem(PIN_HASH_KEY);
    showLockScreen();
  });

  // ページを完全に離れる(閉じる/別サイトへ移動する)時だけロックする。
  // タブの切り替えや最小化、カメラの起動だけでは維持する(頻繁なPIN再入力を避けるため)。
  window.addEventListener('pagehide', () => { flushPhotoSave(); showLockScreen(); });
  // 戻るボタン等でキャッシュから復帰したときは、ロック画面のまま指紋の確認を出す
  window.addEventListener('pageshow', (e) => { if (e.persisted) tryBioUnlock(); });

  render();
  updateSyncStatusUI();
  initDriveSync();
  checkBioSupported();
  showLockScreen();
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
